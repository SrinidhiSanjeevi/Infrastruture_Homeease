# Checkov policy for terraform/azure. The scan is a real gate: anything NOT
# listed here fails the build. Each skip is an accepted, documented trade-off
# for a single-developer dev environment on trial credit.
directory:
  - terraform/azure
framework:
  - terraform
compact: true
quiet: true

# One-off state-storage bootstrap: applied once with local state, not by CI.
# Follow-up: enable blob versioning + soft delete on the state account.
skip-path:
  - terraform/azure/bootstrap

skip-check:
  # --- Public network endpoints (Private Endpoint = Premium ACR + VNet agents)
  - CKV_AZURE_137   # ACR public access
  - CKV_AZURE_139   # ACR public networking
  - CKV_AZURE_109   # Key Vault firewall / public access
  - CKV2_AZURE_32   # Key Vault private endpoint
  - CKV_AZURE_115   # AKS private cluster (pipeline agents are outside the VNet)
  - CKV_AZURE_160   # NSG port 80 from Internet (public ingress is intended)
  # --- ACR Premium-only features (Basic SKU on trial credit)
  - CKV_AZURE_163   # vulnerability scanning (Defender)
  - CKV_AZURE_164   # signed/trusted images
  - CKV_AZURE_166   # quarantine policy
  - CKV_AZURE_165   # geo-replication
  - CKV_AZURE_233   # zone redundancy
  - CKV_AZURE_237   # dedicated data endpoints
  # --- AKS: cost or node-pool recreation, tracked as future work
  - CKV_AZURE_170   # paid SKU/SLA (dev uses Free tier)
  - CKV_AZURE_168   # min 50 pods (forces node pool recreation)
  - CKV_AZURE_232   # critical-addons-only system pool (forces recreation)
  - CKV_AZURE_226   # ephemeral OS disks (VM-size dependent)
  - CKV_AZURE_117   # disk encryption set (customer-managed keys)
  - CKV_AZURE_227   # host-based encryption
  - CKV_AZURE_141   # local admin disabled: switch exists (admin_group_object_ids +
                    # local_account_disabled), enabled once an Entra group is set
