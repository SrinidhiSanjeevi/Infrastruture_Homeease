# Plan one environment and publish the plan file for a later apply.
parameters:
  - name: env
    type: string
  # staging/prod are not deployed, so their own identities do not exist yet.
  # Their plan-only stages reuse the dev connection (it can read tfstate).
  - name: serviceConnection
    type: string
    default: azure-homeease-dev
  # dev plans with the real values (Library > Secure files > dev.tfvars).
  # staging/prod are plan-only, so the committed example values are enough.
  - name: secureVarFile
    type: string
    default: ""

jobs:
  - job: plan_${{ parameters.env }}
    displayName: Plan (${{ parameters.env }})
    steps:
      - template: terraform-setup.yml

      - ${{ if ne(parameters.secureVarFile, '') }}:
          - task: DownloadSecureFile@1
            name: tfvars
            displayName: Download ${{ parameters.secureVarFile }}
            inputs:
              secureFile: ${{ parameters.secureVarFile }}

          - task: AzureCLI@2
            displayName: terraform init + plan (${{ parameters.env }})
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: $(Build.SourcesDirectory)/pipelines/scripts/terraform-plan.sh
              arguments: $(Build.SourcesDirectory)/terraform/azure/environments/${{ parameters.env }} $(tfvars.secureFilePath)

      - ${{ if eq(parameters.secureVarFile, '') }}:
          - task: AzureCLI@2
            displayName: terraform init + plan (${{ parameters.env }})
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: $(Build.SourcesDirectory)/pipelines/scripts/terraform-plan.sh
              arguments: $(Build.SourcesDirectory)/terraform/azure/environments/${{ parameters.env }} $(Build.SourcesDirectory)/terraform/azure/environments/${{ parameters.env }}/plan-only.tfvars.example

      - task: PublishPipelineArtifact@1
        displayName: Publish plan
        inputs:
          targetPath: $(Build.SourcesDirectory)/terraform/azure/environments/${{ parameters.env }}
          artifact: plan-${{ parameters.env }}
